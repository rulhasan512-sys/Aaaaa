name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_RAW=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java raw version: $JAVA_VERSION_RAW"
          
          JAVA_MAJOR_VERSION=$(echo "$JAVA_VERSION_RAW" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          
          if ! [[ "$JAVA_MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse Java major version from '$JAVA_VERSION_RAW'."
            exit 1
          fi

          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR_VERSION) is lower than 17."
            exit 1
          fi
          
          echo "Java environment verified successfully: Major version $JAVA_MAJOR_VERSION >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create or find ./debug.keystore."
            exit 1
          fi

          echo "Temporary debug keystore confirmed."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK file '$EXPECTED_APK' was not found."
            echo "Searching inside 'app/build/outputs/apk':"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file '$EXPECTED_APK' exists but is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: Expected APK does not have .apk extension."
              exit 1
              ;;
          esac

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified APK: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$SOURCE_APK" ]; then
            echo "ERROR: Source APK '$SOURCE_APK' does not exist."
            exit 1
          fi

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME=$(basename "${{ github.repository }}")
          fi
          
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$TEMP_ASSET_DIR"
          
          TARGET_ASSET_PATH="${TEMP_ASSET_DIR}/${RELEASE_FILENAME}"
          cp "$SOURCE_APK" "$TARGET_ASSET_PATH"

          if [ ! -f "$TARGET_ASSET_PATH" ] || [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare non-empty release asset at '$TARGET_ASSET_PATH'."
            exit 1
          fi

          echo "asset_path=$TARGET_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TARGET_ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at '$ASSET_PATH'."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset '$ASSET_PATH' does not have .apk extension."
              exit 1
              ;;
          esac

          echo "Creating GitHub Release with tag '$RELEASE_TAG'..."

          NOTES=$(cat << 'EOF'
          ### Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${{ github.run_number }}
          - **Workflow Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}
          - **Build Type:** Debug (Signed with temporary debug keystore)

          > ⚠️ **Note:** This APK is intended for testing and development purposes. It is not a production or Google Play Store release.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Delivery Summary ==="
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
            REPO="${{ github.repository }}"
            RELEASE_URL="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"

            echo "GitHub Release published successfully!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "Direct Asset Filename: $ASSET_NAME"

            gh release view "$RELEASE_TAG" || true

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Released Successfully!

          - **Release Tag:** \`${RELEASE_TAG}\`
          - **Release Title:** ${RELEASE_TITLE}
          - **Direct APK Asset:** \`${ASSET_NAME}\`
          - **Release Page:** [Download from GitHub Release](${RELEASE_URL})

          ### 📱 How to Download & Install
          1. Open the [Release Page](${RELEASE_URL}) on your Android phone or browser.
          2. Under **Assets**, tap **\`${ASSET_NAME}\`** to download the APK directly.
          3. Open and install the downloaded APK on your test device.

          > 📦 **Backup:** The standard GitHub Actions artifact \`app-debug-apk\` is also preserved and available in the workflow run summary.
          EOF

          else
            echo "WARNING: GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK build and artifact upload succeeded."
            echo "The debug APK is preserved as the GitHub Actions artifact 'app-debug-apk'."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build Succeeded (Release Notice)

          The debug APK was built successfully and is preserved as a workflow artifact.
          GitHub Release publication encountered an error or was skipped.

          ### 📦 Download Artifact
          You can download the APK from the **Artifacts** section of this workflow run:
          - **Artifact Name:** \`app-debug-apk\`
          - **File:** \`app-debug.apk\`
          EOF
          fi
